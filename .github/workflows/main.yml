name: Robot Framework Azure Shift-Left Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure-and-test:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Pull your existing Robot Framework repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log in securely to Azure using OpenID Connect (OIDC)
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 3. Spin up an Azure Container Instance dynamically to act as your staging test environment
    - name: Create Dynamic Azure Test Environment
      run: |
        az group create --name AzureQARg --location eastus

        # Retry up to 3 times for transient registry failures
        for attempt in {1..3}; do
          if az container create \
            --resource-group AzureQARg \
            --name qa-staging-app \
            --image mcr.microsoft.com/windows/servercore:ltsc2022 \
            --os-type Windows \
            --cpu 1 \
            --memory 1.5 \
            --ports 80 \
            --dns-name-label qa-env-${{ github.run_id }}; then
            break
          else
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            else
              exit 1
            fi
          fi
        done

    # 4. Set up Python environment inside the GitHub runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 5. Pre-install Google Chrome dependencies required for headless Linux execution
    - name: Setup Chrome for Headless Testing
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        # Remove old system chromedriver to avoid conflicts
        sudo rm -f /usr/bin/chromedriver
        
        # Start virtual display for headed mode
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

    # 6. Install Robot Framework and Selenium Library dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install robotframework robotframework-seleniumlibrary webdriver-manager
        #python -m webdriver_manager.cli chromium --stable  # Download compatible ChromeDriver
        python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 7. Run your EXISTING Robot Framework tests against the site variable
    #- name: Run Robot Framework Test Suite
    #  env:
    #    # We pass the XYZ Bank testing site target URL here
    #    TARGET_URL: "https://www.globalsqa.com/angularJs-protractor/BankingProject/#/login"
    #  run: |
    #    # Injects the variable directly into your .robot file execution at runtime
    #   robot --variable URL:${{ env.TARGET_URL }} --outputdir robot-results .

      # 7. Run your Robot Framework tests specifying the environment target
    - name: Run Robot Framework Test Suite
      env:
        DISPLAY: :99
      run: |
        # Use webdriver-manager to ensure ChromeDriver matches Chrome version
        # export CHROMEDRIVER_PATH=$(python -c "from webdriver_manager.chrome import ChromeDriverManager; print(ChromeDriverManager().install())")
        # export PATH="$CHROMEDRIVER_PATH:$PATH"
        # Explicitly tells the execution suite to trigger tests against the Staging environment configuration
        robot --variable ENVIRONMENT:staging --variable BROWSER:chrome --outputdir robot-results .
 

        # 8. Save the generated Robot Framework HTML reports to Azure Blob Storage
    - name: Archive QA Test Reports to Azure Storage
      if: always() # Crucial: Runs even if your Robot tests fail so you can see why they failed
      run: |
        STORAGE_NAME="qareports${{ github.run_id }}"
        # Normalize name to valid alphanumeric format for Azure compatibility
        CLEAN_STORAGE_NAME=$(echo "$STORAGE_NAME" | tr -cd 'a-z0-9' | cut -c1-24)
        
        az storage account create --name $CLEAN_STORAGE_NAME --resource-group AzureQARg --location eastus --sku Standard_LRS
        az storage container create --name robot-html-reports --account-name $CLEAN_STORAGE_NAME
        
        # Create robot-results directory if it doesn't exist
        mkdir -p ./robot-results
        
        # Upload log.html, report.html, and output.xml to Azure Storage (only if files exist)
        if [ -n "$(ls -A ./robot-results 2>/dev/null)" ]; then
          az storage blob upload-batch --source ./robot-results --destination robot-html-reports --account-name $CLEAN_STORAGE_NAME
        else
          echo "No test results found to upload"
        fi
    
    
    
    
    
    
    # 8. Save the generated Robot Framework HTML reports to Azure Blob Storage
