name: Robot Framework Azure Shift-Left Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure-and-test:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Pull your existing Robot Framework repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log in securely to Azure using OpenID Connect (OIDC)
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 3. Set up Python environment inside the GitHub runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 4. Pre-install Google Chrome for headless Linux execution
    - name: Setup Chrome for Headless Testing
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Start virtual display for headed mode
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

    # 5. Install Robot Framework and Selenium Library dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Clear any cached webdriver files to ensure fresh download
        rm -rf ~/.wdm
        
        # Install packages
        pip install robotframework robotframework-seleniumlibrary webdriver-manager
        pip install --upgrade selenium
        
        # Get installed Chrome version
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
        echo "Installed Chrome version: $CHROME_VERSION"
        
        # Download matching ChromeDriver
        python << 'EOF'
        import subprocess
        import re
        
        # Get Chrome version
        result = subprocess.run(['google-chrome', '--version'], capture_output=True, text=True)
        chrome_version = result.stdout.strip().split()[-1]
        major_version = chrome_version.split('.')[0]
        
        print(f"Chrome version: {chrome_version}")
        print(f"Major version: {major_version}")
        
        # Use webdriver-manager to get matching driver
        from webdriver_manager.chrome import ChromeDriverManager
        from webdriver_manager.core.driver_cache import DriverCacheManager
        
        driver_path = ChromeDriverManager().install()
        print(f"ChromeDriver installed at: {driver_path}")
        EOF
        
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 6. Run your Robot Framework tests specifying the environment target
    - name: Run Robot Framework Test Suite
      env:
        DISPLAY: :99
      run: |
        robot --variable ENVIRONMENT:staging --variable BROWSER:chrome --outputdir robot-results .

    # 7. Save the generated Robot Framework HTML reports to Azure Blob Storage
    - name: Archive QA Test Reports to Azure Storage
      if: always()
      run: |
        STORAGE_NAME="qareports${{ github.run_id }}"
        # Normalize name to valid alphanumeric format for Azure compatibility
        CLEAN_STORAGE_NAME=$(echo "$STORAGE_NAME" | tr -cd 'a-z0-9' | cut -c1-24)
        
        az group create --name AzureQARg --location eastus
        az storage account create --name $CLEAN_STORAGE_NAME --resource-group AzureQARg --location eastus --sku Standard_LRS
        az storage container create --name robot-html-reports --account-name $CLEAN_STORAGE_NAME
        
        # Create robot-results directory if it doesn't exist
        mkdir -p ./robot-results
        
        # Upload log.html, report.html, and output.xml to Azure Storage (only if files exist)
        if [ -n "$(ls -A ./robot-results 2>/dev/null)" ]; then
          az storage blob upload-batch --source ./robot-results --destination robot-html-reports --account-name $CLEAN_STORAGE_NAME
        else
          echo "No test results found to upload"
        fi
    
    # 8. Tear down the environment completely to keep your Azure credit safe
    - name: Cleanup Azure Resources (Cost Protection)
      if: always()
      run: |
        az group delete --name AzureQARg --yes --no-wait
