    # 9. Tear down the environment completely to keep your $200 Azure credit safe
    - name: Cleanup Azure Resources (Cost Protection)
      if: always() # Always runs to prevent resource leaks and save your budget
      run: |
        az group delete --name AzureQARg --yes --no-wait
